<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1> Student Resgistation portal</h1>
    <form actionv="/form making" method="post">
        <label for="fullName">Full Name:</label>
        <input type="text" id="fullName" name="fullName" placeholder="enter name">
        <br>
        <label for="email"> University mail : </label>
        <input type="email" id="email" name="email" placeholder="enter email">
        <br>
        <label for="age"> Age: </label>
        <input type="number" id="age" name="age" placeholder="enter age">
        <br>
        <label for="DOB"> Date Of Birth: </label>
        <input type="date" id="DOB" name="Date Of Birth">
        <br>

        <label for="gender"> Gender: </label>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male"> male </label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female"> female </label>

        <br>
        <label> Skills :</label>
        <input type="checkbox" id="java" value="java">
        <label for="java"> java </label>
        <input type="checkbox" id="C++" value="C++">
        <label for="C++"> C++ </label>

        <br>
        <button type="Submit"> Submit </button>
    </form>
</body>
</html>
